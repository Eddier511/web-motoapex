name: Verify public API integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          check-latest: true
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: node --version && pnpm --version
      - run: pnpm audit --audit-level=low
      - run: pnpm test:http
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
